version: '1'

# Ignore non-code assets, large datasets, audio samples, and model weights to keep diff within quota
ignore:
  - ".git"
  - ".venv"
  - "venv"
  - "env"
  - "audio/**"
  - "demo_samples/**"
  - "data_demo/**"
  - "test_multilingual_calls/**"
  - "docs/**"
  - "results_master_unified/**"
  - "frontend/node_modules/**"
  - "frontend/dist/**"
  - "**/*.csv"
  - "**/*.json"
  - "**/*.npz"
  - "**/*.wav"
  - "**/*.ogg"
  - "**/*.mpeg"
  - "**/*.mp4"
  - "**/*.pt"
  - "**/*.onnx"
  - "static/**"
